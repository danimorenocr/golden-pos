name: Build and Release Develop POS

on:
  push:
    branches:
      - develop-deploy

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Adjust docker-compose.yml for develop tags
        shell: bash
        run: |
          sed -i 's/:latest/:develop/g' docker-compose.yml
          cat docker-compose.yml

      - name: Rename App for Dev environment
        working-directory: ./electron-app
        run: |
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.name = 'golden-pos-app-dev'; pkg.appId = 'com.goldenpos.app.dev'; pkg.productName = 'Golden POS Dev'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"

      - name: Install Electron App Dependencies
        working-directory: ./electron-app
        run: npm install

      - name: Build and Publish Electron App
        working-directory: ./electron-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always
